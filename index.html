<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>姊妹同心 五百公斤｜有良心的交換禮物</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#f8f1df;background:#102c25}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#315647,#102c25 55%);display:flex;justify-content:center;padding:32px 16px}.card{width:min(100%,520px);background:#183c32;border:1px solid #9d8753;border-radius:22px;padding:26px;box-shadow:0 20px 55px #0005}h1{font-family:Georgia,serif;text-align:center;color:#e9ce8d;font-size:29px}h2{color:#e9ce8d}p{line-height:1.65}.muted{color:#c5d0c6;font-size:14px}label{display:block;margin-top:18px;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid #9d8753;border-radius:10px;padding:13px;background:#fdfaf3;color:#17251d;font-size:16px}textarea{min-height:105px}button{border:0;border-radius:11px;padding:13px 16px;background:#dfc17e;color:#1e3329;font-weight:700;font-size:16px;cursor:pointer;margin-top:15px;width:100%}button:disabled{opacity:.5}.secondary{background:#315c4b;color:white;border:1px solid #a58b57}.hide{display:none}.wish{padding:22px;background:#f9f0d9;color:#244236;border-radius:15px;font-size:23px;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#e9ce8d}hr{border:0;border-top:1px solid #67816d;margin:24px 0}.linkrow{margin:13px 0;padding:12px;border:1px solid #7e926d;border-radius:10px}.linkrow button{margin:8px 0 0}.status{margin:14px 0;color:#ffe3a2}</style></head><body><main class="card"><div style="text-align:center;font-size:40px">🎄🎁✨</div><h1>姊妹同心 五百公斤</h1><p style="text-align:center">🎁 有良心的交換禮物 🎁</p><p id="status" class="status">正在連線…</p><section id="join" class="hide"><h2>寫下你的願望</h2><p class="muted">請選擇自己的固定編號。每個編號只能提交一次願望，請勿代填。</p><label for="number">我的編號</label><select id="number"><option value="">請選擇</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select><label for="wish">我想收到的禮物</label><textarea id="wish" maxlength="600" placeholder="例如：奶油白色保溫杯，容量 500ml"></textarea><button id="submit">送出秘密願望 🎁</button><p class="muted">提交後無法自行修改。請勿填寫私人敏感資料。</p></section><section id="waiting" class="hide"><h2>願望收集進度</h2><p>已收集 <strong id="count">0</strong> / 8 份願望。</p><p>收滿 8 份後會自動抽籤，主辦人再傳送每個人的專屬連結。</p></section><section id="result" class="hide"><h2>🎅 你的秘密任務</h2><p>今年你要準備的禮物是：</p><div id="resultWish" class="wish"></div><p>🤫 交換當天再揭曉！</p></section><section id="admin" class="hide"><hr><h2>🔐 主辦人控制台</h2><div id="adminLogin"><label>管理密碼</label><input id="password" type="password"><button id="unlock">進入管理頁</button></div><div id="adminPanel" class="hide"><p>收集進度：<strong id="adminCount">0</strong>/8</p><div id="links"></div><button id="reroll" class="secondary">重新抽籤（舊連結失效）</button><button id="reset" class="secondary">清空願望（測試後重置）</button><p class="muted">這是朋友聚會用的簡易版本，不適合存放私人或敏感資訊。管理密碼和連結不是嚴格的安全防護。</p></div></section><footer style="text-align:center;margin-top:30px"><a id="adminToggle" href="#admin">主辦人入口</a></footer></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,onSnapshot,runTransaction,collection,getDocs,writeBatch} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBhnfO3EYrijBXOSQT2dOljDbXA0yKcUvM',authDomain:'secret-santa-2026-3fd43.firebaseapp.com',projectId:'secret-santa-2026-3fd43',storageBucket:'secret-santa-2026-3fd43.firebasestorage.app',messagingSenderId:'224549101951',appId:'1:224549101951:web:0e3cd5f7326489c9747a4a',measurementId:'G-VRRC371NMV'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=id=>document.getElementById(id),show=id=>$(id).classList.remove('hide'),hide=id=>$(id).classList.add('hide');const meta=doc(db,'santa','state'),wishes=collection(db,'wishes'),token=new URLSearchParams(location.search).get('token');let isAdmin=false,latest=null,uid=null;const say=s=>$('status').textContent=s;
function randomPermutation(){for(let attempt=0;attempt<1000;attempt++){const b=[1,2,3,4,5,6,7,8];for(let i=7;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}if(b.every((v,i)=>v!==i+1))return b}throw Error('抽籤失敗')}
function randomToken(){return [...crypto.getRandomValues(new Uint8Array(18))].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function initialize(){await signInAnonymously(auth);uid=auth.currentUser.uid;onSnapshot(meta,async snap=>{latest=snap.exists()?snap.data():{count:0,phase:'collect'};$('count').textContent=latest.count||0;$('adminCount').textContent=latest.count||0;if(token){hide('join');hide('waiting');await renderResult();return}show('waiting');if(latest.phase==='drawn'){hide('join');say('🎉 8 份願望已收集完成，抽籤已完成！')}else{show('join');say(`目前已收到 ${latest.count||0}/8 份願望`);if(latest.count===8)attemptDraw()}if(isAdmin)renderAdmin()},err=>say('資料庫連線失敗：'+err.message))}
async function renderResult(){if(latest?.phase!=='drawn'){say('尚未完成抽籤');return}try{const assignment=(latest.tokens||[]).find(t=>t.token===token);if(!assignment){say('連結無效或已過期');return}const docs=await getDocs(wishes),item=docs.docs.find(d=>Number(d.id)===assignment.target);if(!item){say('找不到願望資料');return}$('resultWish').textContent=item.data().wish;show('result');say('✨ 已揭曉你的秘密任務')}catch(e){say('讀取失敗：'+e.message)}}
$('submit').onclick=async()=>{const n=Number($('number').value),wish=$('wish').value.trim();if(!n||!wish)return alert('請選擇編號並填寫願望');$('submit').disabled=true;try{await runTransaction(db,async tx=>{const state=await tx.get(meta),wd=doc(db,'wishes',String(n)),prev=await tx.get(wd),s=state.exists()?state.data():{count:0,phase:'collect'};if(s.phase!=='collect')throw Error('許願已截止');if(prev.exists())throw Error('這個編號已經填寫過');if((s.count||0)>=8)throw Error('已收滿 8 人');tx.set(wd,{wish,createdBy:uid,createdAt:Date.now()});tx.set(meta,{count:(s.count||0)+1,phase:'collect'},{merge:true})});say('🎁 許願成功！');$('wish').value='';if(latest?.count>=7)await attemptDraw()}catch(e){alert('送出失敗：'+e.message)}finally{$('submit').disabled=false}};
async function attemptDraw(){try{const docs=await getDocs(wishes);if(docs.size!==8)return;const perm=randomPermutation(),tokens=perm.map((target,i)=>({giver:i+1,target,token:randomToken()}));await runTransaction(db,async tx=>{const snap=await tx.get(meta);if(snap.data()?.phase==='drawn')return;if(snap.data()?.count!==8)throw Error('尚未收滿');tx.set(meta,{count:8,phase:'drawn',tokens,drawnAt:Date.now()})})}catch(e){say('抽籤待完成：'+e.message)}}
function renderAdmin(){if(!isAdmin)return;$('links').replaceChildren();if(latest?.phase!=='drawn'){const p=document.createElement('p');p.textContent='等待收集滿 8 人…';$('links').append(p);if(latest?.count===8){const b=document.createElement('button');b.textContent='完成待處理的抽籤';b.onclick=attemptDraw;$('links').append(b)}return}for(const t of latest.tokens||[]){const wrap=document.createElement('div'),title=document.createElement('div'),btn=document.createElement('button');wrap.className='linkrow';title.textContent=`${t.giver} 號專屬連結`;btn.textContent='複製連結';btn.onclick=async()=>{const url=new URL(location.href);url.search='?token='+t.token;url.hash='';try{await navigator.clipboard.writeText(url.href);alert('已複製 '+t.giver+' 號連結')}catch{prompt('請複製連結',url.href)}};wrap.append(title,btn);$('links').append(wrap)}}
$('adminToggle').onclick=e=>{e.preventDefault();show('admin');$('admin').scrollIntoView({behavior:'smooth'})};$('unlock').onclick=()=>{if($('password').value!=='Liu')return alert('密碼錯誤');isAdmin=true;hide('adminLogin');show('adminPanel');renderAdmin()};$('reroll').onclick=async()=>{if(!confirm('確定重新抽籤？舊連結會失效。'))return;try{const perm=randomPermutation(),tokens=perm.map((target,i)=>({giver:i+1,target,token:randomToken()}));await runTransaction(db,async tx=>{const s=await tx.get(meta);if(s.data()?.phase!=='drawn')throw Error('尚未抽籤');tx.update(meta,{tokens,drawnAt:Date.now()})});alert('已重新分配')}catch(e){alert(e.message)}};
$('reset').onclick=async()=>{if(prompt('這會刪除所有願望與結果，請輸入 RESET 確認')!=='RESET')return;try{const batch=writeBatch(db),docs=await getDocs(wishes);docs.forEach(d=>batch.delete(d.ref));batch.set(meta,{count:0,phase:'collect',tokens:[]});await batch.commit();alert('已清空')}catch(e){alert('清除失敗：'+e.message)}};
initialize().catch(e=>say('連線失敗：'+e.message));
</script></body></html>
